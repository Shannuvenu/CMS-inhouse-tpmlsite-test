
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        .responsive-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        img {
            width: 100%;
            max-width: 600px; /* Prevents oversized images */
        }
        .desktop-img {
            display: block;
            height: 200px;
        }
        .mobile-img {
            display: none;
            height: 250px;
        }
        @media screen and (max-width: 768px) {
            .desktop-img {
                display: none;
            }
            .mobile-img {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="responsive-container">
        <img src="https://tpml-sites.s3.ap-south-1.amazonaws.com/images/fik_d.png" class="desktop-img" alt="Desktop Image">
        <img src="https://tpml-sites.s3.ap-south-1.amazonaws.com/images/fik_mw.png" class="mobile-img" alt="Mobile Image">
    </div>
</body>
</html>
